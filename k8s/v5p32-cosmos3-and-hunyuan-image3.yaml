apiVersion: batch/v1
kind: Job
metadata:
  name: v5p32-cosmos3-hunyuan3
  namespace: default
  labels:
    app: v5p32-cosmos3-hunyuan3
    suite: omni-world-portfolio
spec:
  completions: 8
  parallelism: 8
  completionMode: Indexed
  backoffLimit: 24
  template:
    metadata:
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
      labels:
        app: v5p32-cosmos3-hunyuan3
        suite: omni-world-portfolio
    spec:
      serviceAccountName: default
      restartPolicy: OnFailure
      terminationGracePeriodSeconds: 15
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        cloud.google.com/tpu-worker-node: tpu-v5p-32-pool
        cloud.google.com/tpu-worker-node: tpu-v5p-slice
        cloud.google.com/tpu-worker-node: 2x4x4
      tolerations:
      - key: "google.com/tpu"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "cloud.google.com/tpu-worker-node"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "cloud.google.com/tpu-worker-node"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: tpu-bench
        image: us-central1-docker.pkg.dev/YOUR_GCP_PROJECT_ID/vllm/vllm-torchtpu-omni:v0.32.0
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        env:
        - name: PJRT_DEVICE
          value: "TPU"
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: HF_TOKEN
              optional: true
        - name: MULTIMODAL_CPU_OFFLOAD_URL
          value: "http://multimodal-cpu-offload-svc.default.svc.cluster.local:8090"
        resources:
          requests:
            google.com/tpu: "4"
            memory: "350Gi"
          limits:
            google.com/tpu: "4"
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        command:
        - bash
        - -lc
        - |
          set -euo pipefail
          ulimit -c 0 || true
          mount -o remount,size=380G /dev/shm || true
          rm -rf /dev/shm/* /dev/shm/.[!.]* /dev/shm/..?* 2>/dev/null || true
          mkdir -p /dev/shm/tmp /dev/shm/hf_cache /dev/shm/uv_cache /dev/shm/pip_cache /dev/shm/torchinductor /tmp/omni_bench
          df -h /dev/shm

          BUCKET="YOUR_GCS_BUCKET"
          TOK=$(curl -sS -H "Metadata-Flavor: Google" \
            "http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token" \
            | python3 -c "import sys, json; print(json.load(sys.stdin)['access_token'])")

          for SCRIPT in \
            gcs_stager.py \
            tpu_single_host_setup.py \
            cpu_offload_client.py \
            run_cosmos3_super_tpu_bench.py \
            run_hunyuan_image3_tpu_bench.py; do
            curl -fsSL --retry 4 --retry-delay 2 \
              -H "Authorization: Bearer ${TOK}" \
              "https://storage.googleapis.com/storage/v1/b/${BUCKET}/o/omni-world-portfolio%2Fscripts%2F${SCRIPT}?alt=media" \
              -o "/tmp/omni_bench/${SCRIPT}"
          done

          IDX="${JOB_COMPLETION_INDEX:-0}"
          echo "[host-${IDX}] Starting cooperative 8-host HF -> GCS staging for Cosmos3-Super and HunyuanImage-3.0..."

          python3 -u /tmp/omni_bench/run_cosmos3_super_tpu_bench.py \
            --stage-only \
            --chip-type=v5p \
            --slice-name=v5p-32 \
            --num-hosts=8 \
            --cores-per-host=4 \
            --bucket="${BUCKET}"

          python3 -u /tmp/omni_bench/run_hunyuan_image3_tpu_bench.py \
            --stage-only \
            --chip-type=v5p \
            --slice-name=v5p-32 \
            --num-hosts=8 \
            --cores-per-host=4 \
            --bucket="${BUCKET}"

          if [ "${IDX}" != "0" ]; then
            echo "[host-${IDX}] Cooperative staging complete across all 3 checkpoints; worker host exiting 0."
            exit 0
          fi

          echo "[host-0] Running full Cosmos3-Super TPU v5p-32 benchmark suite..."
          python3 -u /tmp/omni_bench/run_cosmos3_super_tpu_bench.py \
            --chip-type=v5p \
            --slice-name=v5p-32 \
            --num-hosts=8 \
            --cores-per-host=4 \
            --bucket="${BUCKET}" \
            --use-shm \
            --output-dir=/tmp/omni_bench/results/cosmos3-super

          rm -rf /dev/shm/Cosmos3-Super /dev/shm/cosmos3_worker_*.json || true

          echo "[host-0] Running full HunyuanImage-3.0 TPU v5p-32 benchmark suite..."
          python3 -u /tmp/omni_bench/run_hunyuan_image3_tpu_bench.py \
            --chip-type=v5p \
            --slice-name=v5p-32 \
            --num-hosts=8 \
            --cores-per-host=4 \
            --bucket="${BUCKET}" \
            --use-shm \
            --output-dir=/tmp/omni_bench/results/hunyuan-image-3

          echo "[host-0] Completed Cosmos3-Super + HunyuanImage-3.0 TPU v5p-32 suites."
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
